<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>My Gallery</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#151515;background:#fff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #eee;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px;letter-spacing:-.7px}.actions{display:flex;gap:10px}button.icon{border:0;background:transparent;font-size:24px;padding:4px}main{max-width:850px;margin:auto}.profile{display:flex;align-items:center;gap:22px;padding:26px 18px}.avatar{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#eec6d5,#b8a6e9);display:grid;place-items:center;font-size:35px}.profile h1{font-size:19px;margin:0 0 8px}.muted{color:#777;font-size:13px}.stats{display:flex;gap:24px;font-size:14px}.stats b{display:block;font-size:17px}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #eee}.toolbar button{border:1px solid #ddd;border-radius:9px;background:white;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}.tile{border:0;padding:0;background:#eee;aspect-ratio:1;position:relative;overflow:hidden}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.tile video{display:block;pointer-events:none}.tile .play{position:absolute;top:8px;right:9px;color:white;text-shadow:0 1px 4px #000;font-size:19px}.empty{text-align:center;padding:80px 25px;color:#777}.empty .camera{font-size:54px}.primary{background:#151515;color:white;border:0;border-radius:10px;padding:13px 18px;font-weight:600}.overlay{position:fixed;inset:0;z-index:10;background:#000e;display:flex;align-items:center;justify-content:center}.viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}.viewer{touch-action:pan-x;overscroll-behavior:contain}.viewer #mediaBox{touch-action:pan-x}.viewer .swipehint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 75px);left:50%;transform:translateX(-50%);color:#fff9;font-size:12px;pointer-events:none;white-space:nowrap}.viewer .counter{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:18px;color:white;font-size:13px;pointer-events:none}.viewer button{position:absolute;z-index:2;background:#333b;color:white;border:0;border-radius:25px;padding:9px 13px}.close{top:calc(env(safe-area-inset-top) + 14px);right:14px}.delete{bottom:calc(env(safe-area-inset-bottom) + 20px);right:20px}.navprev{left:10px;top:50%}.navnext{right:10px;top:50%}.dialog{background:#fff;padding:28px 22px;border-radius:18px;width:min(90vw,380px);text-align:center}.dialog h2{margin:0 0 12px}.dialog input{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;text-align:center;font-size:20px;letter-spacing:4px;margin:10px 0}.dialog p{color:#666;font-size:13px;line-height:1.5}.dialog .primary{width:100%}.dialog .secondary{margin-top:12px;background:none;border:0;color:#555;padding:8px}.hidden{display:none!important}.notice{padding:10px 16px;color:#555;font-size:12px;background:#fafafa}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:12px 18px;z-index:20;display:none;max-width:90vw;text-align:center}body.locked main,body.locked header{filter:blur(14px);pointer-events:none}body.locked{overflow:hidden}
</style></head><body><header><strong>My Gallery</strong><div class="actions"><button class="icon" id="lockBtn" aria-label="ロック設定">♧</button><button class="icon" id="addBtn" aria-label="写真・動画を追加">⊕</button></div></header><main><section class="profile"><div class="avatar">✿</div><div><h1>プライベートギャラリー</h1><div class="stats"><span><b id="count">0</b>投稿</span><span><b id="photoCount">0</b>写真</span><span><b id="videoCount">0</b>動画</span></div><p class="muted">写真・動画は端末内に保存</p></div></section><div class="toolbar"><b>▦ 投稿一覧</b><button id="addSmall">＋ 追加する</button></div><div id="grid" class="grid"></div><div id="empty" class="empty"><div class="camera">◎</div><h2>まだ投稿がありません</h2><p>写真や動画を追加すると、ここに3列で並びます。</p><button class="primary" id="emptyAdd">写真・動画を追加</button></div><div class="notice">データはこのブラウザの端末内に保存されます。Safariのサイトデータを消すと失われる場合があります。</div></main><input type="file" id="file" accept="image/*,video/*" multiple class="hidden"><div id="viewerOverlay" class="overlay hidden"><div class="viewer"><button class="close" id="closeView">✕</button><span class="counter" id="viewerCounter"></span><span class="swipehint">↑ 次へ ・ ↓ 前へ</span><button class="navprev" id="prev">‹</button><div id="mediaBox" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"></div><button class="navnext" id="next">›</button><button class="delete" id="delete">削除</button></div></div><div id="lockOverlay" class="overlay hidden"><div class="dialog"><h2 id="lockTitle">ロック</h2><p id="lockDesc"></p><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="4〜12桁"><button class="primary" id="pinSubmit">続ける</button><button class="secondary" id="pinCancel">キャンセル</button></div></div><div id="toast"></div><script>
'use strict';const $=id=>document.getElementById(id);let db,items=[],urls=new Map(),current=0,lockMode='unlock';const enc=new TextEncoder();function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3300)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('my-gallery-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(mode='readonly'){return db.transaction('media',mode).objectStore('media')}function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{const r=tx('readwrite').put(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function urlFor(x){if(!urls.has(x.id))urls.set(x.id,URL.createObjectURL(x.blob));return urls.get(x.id)}
const thumbUrls=new Map();const pendingThumbs=new Set();
function thumbUrl(x){if(!x.thumbnail)return null;if(!thumbUrls.has(x.id))thumbUrls.set(x.id,URL.createObjectURL(x.thumbnail));return thumbUrls.get(x.id)}
function createThumbnail(blob){return new Promise(resolve=>{const v=document.createElement('video');const u=URL.createObjectURL(blob);let done=false;const finish=b=>{if(done)return;done=true;clearTimeout(timer);v.pause();v.removeAttribute('src');v.load();URL.revokeObjectURL(u);resolve(b||null)};const timer=setTimeout(()=>finish(null),12000);v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(0.5,Math.max(0,(v.duration||0)/3))}catch(e){}});const capture=()=>{if(!v.videoWidth||!v.videoHeight)return;try{const c=document.createElement('canvas');const scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));c.width=Math.max(1,Math.round(v.videoWidth*scale));c.height=Math.max(1,Math.round(v.videoHeight*scale));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>finish(b),'image/jpeg',0.78)}catch(e){finish(null)}};v.addEventListener('seeked',capture,{once:true});v.addEventListener('loadeddata',()=>{setTimeout(()=>{if(!done)capture()},900)},{once:true});v.addEventListener('error',()=>finish(null),{once:true});v.src=u;v.load()})}
async function ensureThumbnail(x,img){if(x.thumbnail||pendingThumbs.has(x.id))return;pendingThumbs.add(x.id);try{const blob=await createThumbnail(x.blob);if(blob){const updated={...x,thumbnail:blob};await put(updated);x.thumbnail=blob;if(img.isConnected)img.src=thumbUrl(x)}}catch(e){}finally{pendingThumbs.delete(x.id)}}
let gridObserver=null;const activePreviews=new Set();
function stopPreview(v){v.pause();v.removeAttribute('src');v.load();activePreviews.delete(v)}
function pausePreviews(){activePreviews.forEach(stopPreview)}
function setupPreviewObserver(){if(gridObserver)gridObserver.disconnect();gridObserver=new IntersectionObserver(entries=>{for(const entry of entries){const tile=entry.target,video=tile.querySelector('video');if(!video)continue;const canPlay=entry.isIntersecting&&entry.intersectionRatio>=0.45&&!document.hidden&&$('viewerOverlay').classList.contains('hidden')&&!document.body.classList.contains('locked');if(canPlay){if(!video.getAttribute('src')){video.src=tile.dataset.previewUrl;video.load()}activePreviews.add(video);video.play().catch(()=>{});}else if(activePreviews.has(video))stopPreview(video)}},{threshold:[0,0.45,0.75]});document.querySelectorAll('.tile[data-preview-url]').forEach(tile=>gridObserver.observe(tile))}
async function refresh(){pausePreviews();if(gridObserver)gridObserver.disconnect();items=(await getAll()).sort((a,b)=>b.created-a.created);$('count').textContent=items.length;$('photoCount').textContent=items.filter(x=>!x.video).length;$('videoCount').textContent=items.filter(x=>x.video).length;$('empty').classList.toggle('hidden',!!items.length);const grid=$('grid');grid.replaceChildren();items.forEach((x,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label',x.name);if(x.video){const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.autoplay=false;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.preload='none';v.disablePictureInPicture=true;v.setAttribute('aria-hidden','true');v.poster=x.thumbnail?thumbUrl(x):'';b.dataset.previewUrl=urlFor(x);const badge=document.createElement('span');badge.className='play';badge.textContent='▶';b.append(v,badge);if(!x.thumbnail)ensureThumbnail(x,{isConnected:false})}else{const m=document.createElement('img');m.src=urlFor(x);m.loading='lazy';b.append(m)}b.onclick=()=>show(i);grid.append(b)});setupPreviewObserver()}

function show(i){if(!items.length)return;pausePreviews();current=Math.max(0,Math.min(i,items.length-1));const x=items[current],m=document.createElement(x.video?'video':'img');const old=$('mediaBox').querySelector('video');if(old){old.pause();old.removeAttribute('src');old.load()}m.src=urlFor(x);if(x.video){m.controls=true;m.autoplay=true;m.muted=true;m.defaultMuted=true;m.playsInline=true;m.setAttribute('playsinline','');m.setAttribute('preload','metadata')}m.alt=x.name;$('mediaBox').replaceChildren(m);$('viewerCounter').textContent=(current+1)+' / '+items.length;$('viewerOverlay').classList.remove('hidden');document.body.style.overflow='hidden';if(x.video)m.play().catch(()=>{})}
function hideView(){const v=$('mediaBox').querySelector('video');if(v)v.pause();$('viewerOverlay').classList.add('hidden');$('mediaBox').replaceChildren();document.body.style.overflow='';if(gridObserver)setupPreviewObserver()}
let swipeStart=null;
$('viewerOverlay').addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('button')){swipeStart=null;return}swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()}},{passive:true});
$('viewerOverlay').addEventListener('touchend',e=>{if(!swipeStart||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dy)>55&&Math.abs(dy)>Math.abs(dx)*1.25){if(dy<0&&current<items.length-1)show(current+1);else if(dy>0&&current>0)show(current-1)}},{passive:true});
let lastWheel=0;$('viewerOverlay').addEventListener('wheel',e=>{if(e.target.closest('button'))return;e.preventDefault();if(Math.abs(e.deltaY)<18||Date.now()-lastWheel<450)return;lastWheel=Date.now();if(e.deltaY>0&&current<items.length-1)show(current+1);else if(e.deltaY<0&&current>0)show(current-1)},{passive:false});
async function addFiles(list){let ok=0;for(const f of list){if(!f.type.startsWith('image/')&&!f.type.startsWith('video/'))continue;try{await put({id:crypto.randomUUID(),blob:f,name:f.name,video:f.type.startsWith('video/'),created:Date.now()+ok});ok++}catch(e){notify('保存できませんでした。端末の空き容量をご確認ください');break}}await refresh();if(ok)notify(ok+'件追加しました')}
async function hashPin(pin,salt){const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:150000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function openLock(mode){lockMode=mode;$('lockOverlay').classList.remove('hidden');$('pin').value='';const title={setup:'パスコードを設定',unlock:'ロック解除',disable:'ロックを解除して無効化'};$('lockTitle').textContent=title[mode];$('lockDesc').textContent=mode==='setup'?'4〜12桁の数字を設定してください。これは画面ロックであり、ファイルの暗号化ではありません。':mode==='unlock'?'設定したパスコードを入力してください。':'パスコードを入力するとロック機能を無効化します。';$('pinCancel').classList.toggle('hidden',mode==='unlock');setTimeout(()=>$('pin').focus(),50)}function locked(){return !!localStorage.getItem('gallery-pin')}
async function submitPin(){const pin=$('pin').value;if(!/^\d{4,12}$/.test(pin))return notify('4〜12桁の数字を入力してください');if(lockMode==='setup'){const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem('gallery-salt',JSON.stringify(salt));localStorage.setItem('gallery-pin',await hashPin(pin,salt));$('lockOverlay').classList.add('hidden');notify('パスコードを設定しました')}else{const salt=JSON.parse(localStorage.getItem('gallery-salt')||'[]');if(await hashPin(pin,salt)!==localStorage.getItem('gallery-pin'))return notify('パスコードが違います');if(lockMode==='disable'){localStorage.removeItem('gallery-pin');localStorage.removeItem('gallery-salt');notify('ロックを無効にしました')}document.body.classList.remove('locked');$('lockOverlay').classList.add('hidden')}}
for(const id of ['addBtn','addSmall','emptyAdd'])$(id).onclick=()=>$('file').click();$('file').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};$('closeView').onclick=hideView;$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('delete').onclick=async()=>{if(!confirm('この写真・動画を削除しますか？'))return;const x=items[current];await del(x.id);URL.revokeObjectURL(urls.get(x.id));urls.delete(x.id);if(thumbUrls.has(x.id)){URL.revokeObjectURL(thumbUrls.get(x.id));thumbUrls.delete(x.id)}hideView();await refresh();notify('削除しました')};$('lockBtn').onclick=()=>openLock(locked()?'disable':'setup');$('pinSubmit').onclick=submitPin;$('pin').onkeydown=e=>{if(e.key==='Enter')submitPin()};$('pinCancel').onclick=()=>$('lockOverlay').classList.add('hidden');document.addEventListener('keydown',e=>{if($('viewerOverlay').classList.contains('hidden'))return;if(e.key==='Escape')hideView();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight'||e.key==='ArrowDown')show(current+1);if(e.key==='ArrowUp')show(current-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePreviews();else if(gridObserver&&$('viewerOverlay').classList.contains('hidden'))setupPreviewObserver();if(document.hidden&&locked()){hideView();document.body.classList.add('locked');openLock('unlock')}});
(async()=>{try{db=await openDB();if(locked()){document.body.classList.add('locked');openLock('unlock')}await refresh()}catch(e){notify('ストレージを開けません。Safariの通常モードでお試しください')}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
